

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            background: #ffdddd;
            color: red;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Login</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form  method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
        >

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
        >

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
        >

        <button type="submit">
            Submit
        </button>

    </form>

</div>

</body>
</html>
